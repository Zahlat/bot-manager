[project]
name = "tg-flow"
version = "0.1.0"
description = "Flow-as-data conversation engine for Telegram bots"
requires-python = ">=3.12"
dependencies = ["tg-gateway", "platform-kit"]

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
tg-gateway = { workspace = true }
platform-kit = { workspace = true }
