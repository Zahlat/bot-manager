[project]
name = "tg-gateway"
version = "0.1.0"
description = "Thin typed async Telegram Bot API client, transports and dispatcher"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "platform-kit",
    "pydantic>=2.14.4",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
platform-kit = { workspace = true }
